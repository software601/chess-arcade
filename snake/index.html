<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/snake/style.css" />
    <link rel="stylesheet" href="/viewport.css?v=40" />
  </head>
  <body>
    <div class="stage">
      <header class="hud">
        <h1 class="brand">Snake</h1>
        <nav class="nav">
          <a href="/">Arcade</a>
          <a href="/snake" aria-current="page">Snake</a>
          <a href="/pac-man">Pac-Man</a>
          <a href="/hangman">Hangman</a>
          <a href="/pong">Pong</a>
          <a href="/breakout">Breakout</a>
          <a href="/tetris">Tetris</a>
          <a href="/flappy">Flappy</a>
          <a href="/sokoban">Sokoban</a>
          <a href="/connect4">Connect4</a>
          <a href="/asteroids">Asteroids</a>
          <a href="/minesweeper">Mines</a>
          <a href="/space-invaders">Invaders</a>
          <a href="/chess">Chess</a>
          <a href="/chesspuzzles">Puzzles</a>
          <a href="/chessmulti">Chess Multi</a>
          <a href="/puzzlemulti">Puzzle Multi</a>
          <a href="/chess001">001</a>
          <a href="/chess002">002</a>
        </nav>
        <p class="score" aria-live="polite">Score <span id="score">0</span></p>
      </header>

      <div class="layout">
        <aside class="controls" aria-label="Game settings">
          <div class="settings">
            <div class="step" data-setting="cols">
              <span class="step-label">Width</span>
              <button type="button" class="step-btn" data-dir="-1" aria-label="Width smaller">−</button>
              <span class="step-val" id="val-cols">20</span>
              <button type="button" class="step-btn" data-dir="1" aria-label="Width bigger">+</button>
            </div>
            <div class="step" data-setting="rows">
              <span class="step-label">Length</span>
              <button type="button" class="step-btn" data-dir="-1" aria-label="Length smaller">−</button>
              <span class="step-val" id="val-rows">20</span>
              <button type="button" class="step-btn" data-dir="1" aria-label="Length bigger">+</button>
            </div>
            <div class="step" data-setting="speed">
              <span class="step-label">Speed</span>
              <button type="button" class="step-btn" data-dir="-1" aria-label="Speed smaller">−</button>
              <span class="step-val" id="val-speed">5</span>
              <button type="button" class="step-btn" data-dir="1" aria-label="Speed bigger">+</button>
            </div>
            <div class="step" data-setting="cell">
              <span class="step-label">Density</span>
              <button type="button" class="step-btn" data-dir="-1" aria-label="More blocks">−</button>
              <span class="step-val" id="val-cell">14</span>
              <button type="button" class="step-btn" data-dir="1" aria-label="Fewer blocks">+</button>
            </div>
          </div>

          <button type="button" id="btn-start" class="btn-start">Start</button>
        </aside>

        <div class="board-wrap fill-canvas">
          <canvas id="board" width="640" height="640" aria-label="Snake game board"></canvas>
          <p class="overlay" id="overlay">Press Start</p>
        </div>
      </div>

      <p class="hint" id="hint">− / + to set · Start to play</p>
    </div>

    <script src="/snake/game.js"></script>
  </body>
</html>
