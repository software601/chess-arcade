<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/hangman/hangman.css" />
    <link rel="stylesheet" href="/viewport.css?v=40" />
  </head>
  <body>
    <div class="stage">
      <header class="hud">
        <h1 class="brand">Hangman</h1>
        <nav class="nav">
          <a href="/">Arcade</a>
          <a href="/snake">Snake</a>
          <a href="/pac-man">Pac-Man</a>
          <a href="/hangman" aria-current="page">Hangman</a>
          <a href="/pong">Pong</a>
          <a href="/breakout">Breakout</a>
          <a href="/tetris">Tetris</a>
          <a href="/flappy">Flappy</a>
          <a href="/sokoban">Sokoban</a>
          <a href="/connect4">Connect4</a>
          <a href="/asteroids">Asteroids</a>
          <a href="/minesweeper">Mines</a>
          <a href="/space-invaders">Invaders</a>
          <a href="/chess">Chess</a>
          <a href="/chesspuzzles">Puzzles</a>
          <a href="/chessmulti">Chess Multi</a>
          <a href="/puzzlemulti">Puzzle Multi</a>
          <a href="/chess001">001</a>
          <a href="/chess002">002</a>
        </nav>
        <p class="score" aria-live="polite">
          Wins <span id="wins">0</span>
          · Misses <span id="misses">0</span>/<span id="max-miss">6</span>
        </p>
      </header>

      <div class="layout">
        <aside class="controls" aria-label="Game settings">
          <div class="settings">
            <label class="field">
              <span>Category</span>
              <select id="cfg-category">
                <option value="mixed">Mixed</option>
                <option value="animals">Animals</option>
                <option value="food">Food</option>
                <option value="tech">Tech</option>
                <option value="places">Places</option>
              </select>
            </label>
          </div>
          <button type="button" id="btn-start" class="btn-start">Start</button>
        </aside>

        <div class="board-wrap stack-board">
          <canvas id="board" width="360" height="320" aria-label="Hangman drawing"></canvas>
          <p class="word" id="word" aria-live="polite">_ _ _ _ _</p>
          <p class="overlay" id="overlay">Press Start</p>
          <div class="keys" id="keys" aria-label="Letter keys"></div>
        </div>
      </div>

      <p class="hint" id="hint">Click letters or type · 6 wrong guesses lose</p>
    </div>

    <script src="/hangman/hangman.js"></script>
  </body>
</html>
